server:
  port: 5000
# spring:
#   application:
#     name: gateway-server
spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: gateway-server


  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: USER-SERVICE
          uri: lb://USER-SERVICE
          predicates:
            - Path=/auth/**,/api/admin/users/**,/api/users/**,/users/**

        - id: BOOKING-SERVICE
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/api/bookings/**

        - id: SALOON-SERVICE
          uri: lb://SALOON-SERVICE
          predicates:
            - Path=/salons/**,/api/salons/**,/api/admin/salons/**

        - id: SERVICE-OFFERING
          uri: lb://SERVICE-OFFERING
          predicates:
            - Path=/api/service-offering/**

        - id: CATEGORY-SERVICE
          uri: lb://CATEGORY-SERVICE
          predicates:
            - Path=/api/categories/**

        - id: NOTIFICATIONS-SERVICE
          uri: lb://NOTIFICATIONS-SERVICE
          predicates:
            - Path=/api/notifications/**

        - id: PAYMENT-SERVICE
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**

        - id: REVIEWS-SERVICE
          uri: lb://REVIEWS-SERVICE
          predicates:
            - Path=/api/reviews/**

  #for the gateway server, we need to configure the security settings to enable JWT authentication.
  #  The following configuration sets up the gateway server to act as a resource server that validates
  #  JWT tokens issued by an OAuth2 authorization server.
  security:
    oauth2:
      resource server:
        jwt:
          jwk-set-uri: "http://localhost:8080/realms/master/protocol/openid-connect/certs"






eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/



logging:
  level:
    org.springframework.cloud.gateway: TRACE

